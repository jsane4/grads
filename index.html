<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Place Called Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a dusk sky over a single lit window; the poem types itself out in the open air above it. Single committed night look. */
:root {
  --sky-top: #0b1026;
  --sky-mid: #1c2147;
  --horizon: #5b3a5e;
  --glow: #f6c177;
  --ink: #ece6f4;
  --ink-soft: #a9a3c4;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--body);
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.scene {
  position: relative; z-index: 1;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2.4rem;
  padding-block: 4rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.eyebrow {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--glow); opacity: 0.85; margin: 0;
}
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1; margin: 0;
  text-align: center; text-wrap: balance; letter-spacing: -0.01em;
}
h1 em { color: var(--glow); }
header { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.poem {
  max-width: 34rem; width: 100%;
  font-size: clamp(1.15rem, 3.4vw, 1.45rem); font-style: italic; font-weight: 300;
  line-height: 1.65; margin: 0;
}
.poem p { margin: 0; min-height: 1.65em; }
.poem .stanza-gap { min-height: 1.1em; }
.poem .last { color: var(--glow); font-weight: 400; }
.caret {
  display: inline-block; width: 1px; height: 1.1em; vertical-align: -0.15em;
  background: var(--glow); margin-left: 2px; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
footer { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
.sign { font-family: var(--display); font-style: italic; font-size: 1.3rem; color: var(--ink-soft); margin: 0; }
button {
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase;
  background: transparent; color: var(--ink-soft);
  border: 1px solid color-mix(in srgb, var(--ink-soft) 40%, transparent);
  border-radius: 999px; padding: 0.6rem 1.2rem; cursor: pointer;
  transition: color .2s, border-color .2s;
}
button:hover { color: var(--glow); border-color: var(--glow); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</head>
<body style="margin:0">

<canvas id="sky" aria-hidden="true"></canvas>

<main class="scene">
  <header>
    <p class="eyebrow">Class of 2026</p>
    <h1>Happy Graduation, <em>my dearest friends</em></h1>
  </header>

  <div class="poem" id="poem" aria-live="polite"></div>

  <footer>
    <p class="sign">with love, your friend</p>
    <button type="button" id="replay">Read it again</button>
  </footer>
</main>

<script>
const lines = [
  "No matter how far your wings may carry you,",
  "across new skies and unfamiliar skylines,",
  "",
  "never forget the ones who walked beside you,",
  "who filled the empty pages of your days,",
  "and wrote these chapters with you, line by line.",
  "",
  "For wherever the wind may take you,",
  "there will always be a place called home,",
  "a door left open, a light left on,",
  "waiting for you to return,",
  "again, and again."
];

const poem = document.getElementById("poem");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let run = 0;

function build() {
  poem.innerHTML = "";
  return lines.map((t, i) => {
    const p = document.createElement("p");
    if (!t) p.className = "stanza-gap";
    if (i === lines.length - 1) p.classList.add("last");
    poem.appendChild(p);
    return p;
  });
}

function showAll() {
  build().forEach((p, i) => { p.textContent = lines[i]; });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function typePoem() {
  const id = ++run;
  const ps = build();
  const caret = document.createElement("span");
  caret.className = "caret";
  await wait(600);
  for (let i = 0; i < lines.length; i++) {
    if (id !== run) return;
    const p = ps[i];
    p.appendChild(caret);
    for (const ch of lines[i]) {
      if (id !== run) return;
      caret.before(ch);
      await wait(ch === "," ? 220 : 45);
    }
    await wait(lines[i] ? 450 : 250);
  }
}

document.getElementById("replay").addEventListener("click", () => reduce ? showAll() : typePoem());
reduce ? showAll() : typePoem();

/* Sky: stars, a warm horizon, a lit window, and birds drifting outward */
const c = document.getElementById("sky");
const ctx = c.getContext("2d");
let W, H, stars = [], birds = [];
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({
    x: Math.random() * W, y: Math.random() * H * 0.75,
    r: Math.random() * 1.2 + 0.2, p: Math.random() * Math.PI * 2
  }));
}
function newBird(start) {
  return {
    x: start ? Math.random() * W : W * 0.5 + (Math.random() - 0.5) * 60,
    y: start ? H * (0.2 + Math.random() * 0.5) : H * 0.82,
    vx: (Math.random() - 0.5) * 0.9, vy: -(0.25 + Math.random() * 0.35),
    s: 4 + Math.random() * 5, f: Math.random() * 6
  };
}
function draw(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0b1026"); g.addColorStop(0.6, "#1c2147"); g.addColorStop(1, "#5b3a5e");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = 0.45 + 0.4 * Math.sin(t / 900 + s.p);
    ctx.fillStyle = "#ece6f4";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // hill and house
  ctx.fillStyle = "#0d0f22";
  ctx.beginPath(); ctx.moveTo(0, H);
  ctx.quadraticCurveTo(W * 0.5, H * 0.84, W, H); ctx.fill();
  const hx = W * 0.5, hy = H * 0.885, hs = Math.min(W, H) * 0.035;
  ctx.fillRect(hx - hs, hy - hs, hs * 2, hs * 1.6);
  ctx.beginPath(); ctx.moveTo(hx - hs * 1.3, hy - hs); ctx.lineTo(hx, hy - hs * 2); ctx.lineTo(hx + hs * 1.3, hy - hs); ctx.fill();
  const glow = ctx.createRadialGradient(hx, hy - hs * 0.4, 0, hx, hy - hs * 0.4, hs * 5);
  glow.addColorStop(0, "rgba(246,193,119,0.45)"); glow.addColorStop(1, "rgba(246,193,119,0)");
  ctx.fillStyle = glow; ctx.fillRect(hx - hs * 5, hy - hs * 5, hs * 10, hs * 10);
  ctx.fillStyle = "#f6c177";
  ctx.fillRect(hx - hs * 0.35, hy - hs * 0.7, hs * 0.7, hs * 0.6);

  // birds
  ctx.strokeStyle = "rgba(236,230,244,0.7)"; ctx.lineWidth = 1.3;
  for (let i = 0; i < birds.length; i++) {
    const b = birds[i];
    if (!reduce) { b.x += b.vx; b.y += b.vy; b.f += 0.12; }
    const w = Math.sin(b.f) * b.s * 0.5;
    ctx.beginPath();
    ctx.moveTo(b.x - b.s, b.y - w); ctx.quadraticCurveTo(b.x - b.s * 0.4, b.y - b.s * 0.3, b.x, b.y);
    ctx.quadraticCurveTo(b.x + b.s * 0.4, b.y - b.s * 0.3, b.x + b.s, b.y - w);
    ctx.stroke();
    if (b.y < -20 || b.x < -20 || b.x > W + 20) birds[i] = newBird(false);
  }
  if (!reduce) requestAnimationFrame(draw);
}
addEventListener("resize", () => { resize(); if (reduce) draw(0); });
resize();
birds = Array.from({ length: 9 }, () => newBird(true));
reduce ? draw(0) : requestAnimationFrame(draw);
</script>
</body>
</html>
